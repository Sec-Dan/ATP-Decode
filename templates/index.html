<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATP-Decode - SafeLinks Decoder</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='atpd.css') }}">
    <script defer src="https://analytics.swiftworks.dev/script.js" data-website-id="8b08498d-cc3c-4175-aa63-6bc4db954db8"></script>
</head>
<body>
    <header>
        <a class="brand" href="https://dansec.red">DanSec</a>
        <span class="path">/ atp-decode</span>
        <span class="tagline">Microsoft SafeLinks decoder</span>
    </header>

    <main>
        <section>
            <label for="safelink"><span class="prompt" aria-hidden="true">&gt;</span> paste a safelinks url</label>
            <textarea id="safelink" spellcheck="false" placeholder="https://nam12.safelinks.protection.outlook.com/?url=..." autofocus></textarea>
            <div class="actions">
                <button type="button" onclick="clearAll()">[clear]</button>
            </div>
        </section>

        <section>
            <label for="target_url"><span class="prompt" aria-hidden="true">&gt;</span> decoded url</label>
            <textarea id="target_url" readonly spellcheck="false" placeholder="nothing decoded yet"></textarea>
            <div class="actions">
                <button type="button" onclick="copyResult()" id="copy-btn" data-umami-event="safelink-copy">[copy]</button>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='atpd.js') }}"></script>
</body>
</html>
